<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WorkBoard</title>
<meta name="theme-color" content="#0E6F8E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#F2F4F6; --surface:#FFFFFF; --surface-2:#E9EDF0; --ink:#17212B; --muted:#5B6B79;
  --line:#D5DCE3; --line-strong:#B8C2CC;
  --accent:#0E6F8E; --accent-ink:#FFFFFF; --accent-soft:#DDEFF4;
  --ok:#2E7D4F; --ok-soft:#DCEFE3; --warn:#B4700F; --warn-soft:#F7E9CF;
  --info:#2B62B0; --info-soft:#DCE6F6; --crit:#B9312F; --crit-soft:#F6DCDB;
  --gray:#6B7785; --gray-soft:#E5E9ED;
  --trip:#6A4FC4; --trip-soft:#E9E3F8;
  --event:#C0397A; --event-soft:#F8DDEA; --task:#CF5A1C; --task-soft:#FBE4D6;
  --shadow:0 1px 2px rgba(23,33,43,.06),0 10px 28px rgba(23,33,43,.10);
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0F1519; --surface:#171F26; --surface-2:#1F2931; --ink:#E4EAEF; --muted:#94A3B1;
    --line:#2A353F; --line-strong:#3B4954;
    --accent:#4DB6D3; --accent-ink:#06222B; --accent-soft:#143641;
    --ok:#5BC27F; --ok-soft:#173424; --warn:#E0A64B; --warn-soft:#3A2B12;
    --info:#6FA2E8; --info-soft:#162A45; --crit:#EF6B69; --crit-soft:#3E1A1A;
    --gray:#93A1AE; --gray-soft:#242E37;
    --trip:#B29BF2; --trip-soft:#2A2246;
    --event:#F27DB5; --event-soft:#3E1B2E; --task:#F49A5C; --task-soft:#3F2414;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0F1519; --surface:#171F26; --surface-2:#1F2931; --ink:#E4EAEF; --muted:#94A3B1;
  --line:#2A353F; --line-strong:#3B4954;
  --accent:#4DB6D3; --accent-ink:#06222B; --accent-soft:#143641;
  --ok:#5BC27F; --ok-soft:#173424; --warn:#E0A64B; --warn-soft:#3A2B12;
  --info:#6FA2E8; --info-soft:#162A45; --crit:#EF6B69; --crit-soft:#3E1A1A;
  --gray:#93A1AE; --gray-soft:#242E37;
  --trip:#B29BF2; --trip-soft:#2A2246;
  --event:#F27DB5; --event-soft:#3E1B2E; --task:#F49A5C; --task-soft:#3F2414;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:22px 14px 18px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;flex-direction:column;gap:2px;padding:4px 10px 18px}
.brand strong{font-size:15px;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;border-radius:8px;background:transparent;text-align:left;cursor:pointer;color:var(--muted);font-weight:500}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.side .spacer{flex:1}
.sync{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--gray);flex:none}
.sync[data-mode="cloud"] i{background:var(--ok)}
.sync[data-mode="local"] i{background:var(--warn)}
.side-actions{display:flex;flex-direction:column;gap:2px}
.side-actions .nav{font-size:13px;padding:7px 10px}

.main{padding:22px 28px 48px;min-width:0}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{font-size:22px;letter-spacing:-.02em}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:500;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn svg{width:15px;height:15px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:500;line-height:1.5;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill svg{width:12px;height:12px}
.pill:has(svg)::before{display:none}
.tone-gray{background:var(--gray-soft);color:var(--gray)}
.tone-warn{background:var(--warn-soft);color:var(--warn)}
.tone-info{background:var(--info-soft);color:var(--info)}
.tone-accent{background:var(--accent-soft);color:var(--accent)}
.tone-ok{background:var(--ok-soft);color:var(--ok)}
.tone-crit{background:var(--crit-soft);color:var(--crit)}
.tone-trip{background:var(--trip-soft);color:var(--trip)}
.tone-event{background:var(--event-soft);color:var(--event)}
.tone-task{background:var(--task-soft);color:var(--task)}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11.5px;background:var(--surface-2);color:var(--muted);white-space:nowrap}

.panel{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:14px}
.panel-h .cnt{font-family:var(--mono);color:var(--muted);font-size:12px}
.list{display:flex;flex-direction:column}
.row{display:grid;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;color:inherit}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .t{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{color:var(--muted);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .date{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.row .date.crit{color:var(--crit);font-weight:500}
.row .date.soon{color:var(--warn);font-weight:500}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}

.row .pill{justify-self:start}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);--c:var(--gray);--cs:var(--gray-soft)}
@supports (background:color-mix(in srgb,red 50%,blue)){
  .col{background:color-mix(in srgb,var(--cs) 42%,var(--surface));border-color:color-mix(in srgb,var(--c) 22%,var(--line))}
}
.col-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 4px}
.col-h .cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.card{display:flex;flex-direction:column;gap:8px;width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;text-align:left;color:inherit}
.card:hover{border-color:var(--line-strong);box-shadow:0 1px 2px rgba(23,33,43,.06)}
.card .t{display:flex;align-items:flex-start;gap:7px;font-weight:600;line-height:1.35;min-width:0}
.card .t svg{width:15px;height:15px;flex:none;margin-top:2px;color:var(--muted)}
.card .t span{min-width:0;overflow-wrap:anywhere}
.card .m{color:var(--muted);font-size:12px;margin:-4px 0 0 22px}
.card .date{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .date.crit{color:var(--crit);font-weight:500}
.card .date.soon{color:var(--warn);font-weight:500}
.card .foot{display:flex;align-items:center;gap:8px}
.card .foot .pct{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.card .bar{width:100%}
.card.is-done .t{color:var(--muted)}
.col-add{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border:1px dashed var(--line-strong);border-radius:9px;background:transparent;color:var(--c);cursor:pointer;font-weight:500;font-size:13px}
.col-add:hover{background:var(--surface)}
.col-add svg{width:14px;height:14px}
.col-empty{padding:14px 8px;text-align:center;color:var(--muted);font-size:12.5px}
.home-board{margin-top:22px}
.detail-head{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;padding:14px 16px}
.detail-head .prog{flex:1 1 260px;display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums}
.detail-head .prog-l{display:flex;justify-content:space-between;gap:8px}
.detail-head .prog-l b{color:var(--ink);font-weight:500}
.detail-head .kv{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted)}
.detail-head .kv b{color:var(--ink);font-weight:500;font-family:var(--mono);font-variant-numeric:tabular-nums}
.detail-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.detail-events{margin-top:20px}
.ev-row{grid-template-columns:auto minmax(0,1fr) auto}
.ev-row .when{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ev-row .name{display:flex;flex-direction:column;min-width:0}
.ev-row .name b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev-row .name small{color:var(--muted);font-size:12px}
.back{margin-bottom:8px}
.home-board h2{font-size:15px;margin-bottom:10px}
.task-row{grid-template-columns:auto minmax(0,1fr) auto;cursor:pointer}
.task-row .chk{width:18px;height:18px;margin:0;accent-color:var(--ok);cursor:pointer}
.task-row .name{display:flex;flex-direction:column;min-width:0}
.task-row .name b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-row .name small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-row.done .name b{color:var(--muted);text-decoration:line-through}
.layer[data-layer="tasks"] i{background:var(--task)}
.proj-list{display:flex;flex-direction:column;gap:14px}
.proj-sec.is-done{opacity:.72}
.proj-head{display:flex;align-items:center;gap:12px;padding:14px 16px 10px;flex-wrap:wrap}
.proj-title{flex:1 1 240px;min-width:0;display:flex;flex-direction:column}
.proj-title h2{font-size:15px}
.proj-title .m{color:var(--muted);font-size:12.5px}
.proj-tools{display:flex;gap:6px;margin-left:auto}
.proj-meta{display:flex;align-items:center;gap:16px;padding:0 16px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.proj-meta .prog{flex:1 1 220px;display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted);font-family:var(--mono);font-variant-numeric:tabular-nums}
.proj-meta .prog-l{display:flex;justify-content:space-between;gap:8px}
.proj-meta .prog-l b{color:var(--ink);font-weight:500}
.mat-link{color:var(--muted);font-family:var(--mono);font-size:12px}
.mat-link svg{width:13px;height:13px}
.empty.small{padding:16px}
.hidden-note{display:block;width:100%;padding:8px 16px;font-size:12px;color:var(--accent);border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.hidden-note:hover{background:var(--surface-2)}
.proj-group{display:flex;align-items:center;gap:10px;margin:8px 0 -4px;font-size:13px;font-weight:600;color:var(--muted)}
.proj-group:first-child{margin-top:0}
.proj-group .cnt{font-family:var(--mono);font-weight:400;font-size:12px}
.proj-group::after{content:'';flex:1;height:1px;background:var(--line)}
.switch{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;padding:6px 4px}
.switch input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.vendor-row{grid-template-columns:minmax(0,1fr) auto auto}
.vendor-row .name{display:flex;flex-direction:column;min-width:0}
.vendor-row .name b{font-weight:500}
.vendor-row .name small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters select,.filters input{padding:7px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);min-width:0}
.filters input{flex:1 1 180px}
.filters select{flex:0 1 auto}

.mat-head,.mat-row{display:grid;grid-template-columns:36px minmax(180px,1.6fr) minmax(120px,1fr) 80px 104px 104px 90px;gap:12px;align-items:center}
.mat-head{padding:9px 16px;font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--line);font-weight:500}
.mat-row{padding:10px 16px;cursor:pointer}
.mat-row.compact{grid-template-columns:36px minmax(0,1fr) auto auto}
.mat-row.compact .hide-m{display:none}
.mat-row.compact .mob{display:none}
.mat-row .chk{width:18px;height:18px;margin:0;accent-color:var(--ok);cursor:pointer;justify-self:center}
.mat-row.done .name b{color:var(--muted)}
.mat-head .c{text-align:center}
.mat-row .name{display:flex;flex-direction:column;min-width:0}
.mat-row .name b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat-row .name small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mat-row .num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--muted);font-size:12.5px}
.mat-row .mob{display:none}
.mat-group{padding:8px 16px;background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.mat-group .mono{font-weight:400}

.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:stretch}
.cal-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.cal-toolbar .mo{display:flex;align-items:center;gap:6px}
.cal-toolbar .mo h2{font-size:18px;font-family:var(--mono);font-weight:500;min-width:112px;text-align:center;letter-spacing:-.01em}
.layers{display:flex;gap:6px;flex-wrap:wrap}
.layer{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:12.5px;color:var(--muted)}
.layer i{width:8px;height:8px;border-radius:50%;background:var(--gray)}
.layer[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.layer[data-layer="events"] i{background:var(--event)}
.layer[data-layer="eta"] i{background:var(--accent)}
.layer[data-layer="order"] i{background:var(--gray)}
.layer[data-layer="projects"] i{background:conic-gradient(var(--info) 0 25%,var(--warn) 0 50%,var(--crit) 0 75%,var(--trip) 0)}
.cal{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line);background:var(--surface-2)}
.dow span{padding:7px 8px;font-size:11.5px;color:var(--muted);font-weight:500;text-align:left}
.dow span:first-child{color:var(--crit)} .dow span:last-child{color:var(--info)}
.grid{display:flex;flex-direction:column}
.week{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.bars{position:absolute;inset:0;pointer-events:none}
.bar-item{position:absolute;pointer-events:auto;z-index:1;cursor:pointer;font:inherit;border:0;border-left:3px solid currentColor;text-align:left}
.bar-item:hover{filter:brightness(.96)}
.bar-item.cl{border-top-left-radius:0;border-bottom-left-radius:0;border-left-width:0;padding-left:8px}
.bar-item.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.cell .spacer{flex:none}
.cell{min-height:104px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;background:transparent;border-top:0;border-left:0;cursor:pointer;text-align:left;color:inherit;min-width:0}
.cell:nth-child(7n){border-right:0}
.cell.pad{background:var(--bg);cursor:default}
.cell:not(.pad):hover{background:var(--surface-2)}
.cell .dn{height:22px;font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between}
.cell .dn b{font-weight:500}
.cell.sun .dn{color:var(--crit)} .cell.sat .dn{color:var(--info)}
.cell.today .dn b{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:500}
.cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.chip[draggable]{cursor:grab}
.chip[draggable]:active{cursor:grabbing}
body.dragging .cell:not(.pad){outline:1px dashed var(--line-strong);outline-offset:-3px}
.cell.drop{background:var(--accent-soft)!important;box-shadow:inset 0 0 0 2px var(--accent)}
.chip.ghost{opacity:.4}
.chip{display:flex;align-items:center;gap:4px;height:20px;padding:0 6px 0 5px;border-radius:4px;font-size:11.5px;line-height:18px;white-space:nowrap;border-left:3px solid currentColor;min-width:0}
.chip svg{width:11px;height:11px;flex:none;opacity:.9}
.chip span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.chip.more{display:block;background:transparent;color:var(--muted);border:0;padding-left:6px}
.chip.proj{font-weight:600}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%}
.dot-info{background:var(--info)} .dot-accent{background:var(--accent)} .dot-gray{background:var(--gray)} .dot-crit{background:var(--crit)} .dot-ok{background:var(--ok)} .dot-warn{background:var(--warn)} .dot-trip{background:var(--trip)} .dot-event{background:var(--event)} .dot-task{background:var(--task)}

.day-col{position:relative;min-height:320px}
.day-panel{position:absolute;inset:0;display:flex;flex-direction:column}
.day-panel .panel-h{flex:none}
.day-panel .panel-h .r{display:flex;gap:4px}
.day-panel .list{flex:1;min-height:0;overflow:auto}
.day-panel .empty{margin:auto 0}
.day-item{display:grid;grid-template-columns:4px minmax(0,1fr);gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;color:inherit}
.day-item:last-child{border-bottom:0}
.day-item:hover{background:var(--surface-2)}
.day-item i{border-radius:2px;background:var(--c,var(--gray))}
.day-item .t{font-weight:500;display:inline-flex;align-items:center;gap:6px}
.day-item .t svg{width:14px;height:14px;flex:none;color:var(--c,var(--muted))}
.day-item .m{color:var(--muted);font-size:12.5px}

dialog{border:0;border-radius:12px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(10,16,22,.5)}
dialog.cfm{width:min(380px,calc(100vw - 32px))}
.cfm-b{padding:20px}
.cfm-b p{margin:0 0 16px;white-space:pre-line;line-height:1.55}
.cfm-b .r{display:flex;justify-content:flex-end;gap:8px}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0}
.dlg-h h2{font-size:16px}
.dlg-b{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;max-height:calc(100vh - 170px);overflow:auto}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.span2{grid-column:1/-1}
.field[hidden]{display:none}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);min-width:0;width:100%}
.field textarea{resize:vertical;min-height:64px}
.dlg-f{display:flex;justify-content:space-between;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line)}
.dlg-f .r{display:flex;gap:8px}
.help{grid-column:1/-1;font-size:12.5px;color:var(--muted);line-height:1.55;margin:0}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);padding:9px 14px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.tabbar{display:none}

@media (max-width:1100px){
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail-cols{grid-template-columns:1fr}
  .cal-wrap{grid-template-columns:1fr}
  .day-col{min-height:0}
  .day-panel{position:static}
  .day-panel .list{max-height:320px}
}
@media (max-width:760px){
  #app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:16px 16px 88px}
  .topbar{margin-bottom:14px}
  .topbar h1{font-size:19px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;border:0;background:transparent;color:var(--muted);font-size:11px;cursor:pointer}
  .tab svg{width:20px;height:20px}
  .tab[aria-current="page"]{color:var(--accent)}
  .board{grid-template-columns:1fr}
  .mat-head{display:none}
  .mat-row{grid-template-columns:auto minmax(0,1fr);row-gap:4px}
  .mat-row .hide-m{display:none}
  .mat-row .mob{display:flex;grid-column:2;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;font-family:var(--mono)}
  .cell{min-height:56px;padding:5px 4px}
  .cell .chip{display:none}
  .cell .dots{display:flex}
  .bars,.cell .spacer{display:none}
  .dlg-b{grid-template-columns:1fr}
  .field.span2{grid-column:auto}
}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>

<div id="app">
  <aside class="side">
    <div class="brand"><strong>WorkBoard</strong></div>
    <button class="nav" data-action="nav" data-tab="home">${ICON.home}<span>캘린더</span></button>
    <button class="nav" data-action="nav" data-tab="projects">${ICON.task}<span>프로젝트 · 할 일</span></button>
    <button class="nav" data-action="nav" data-tab="materials">${ICON.mat}<span>자재</span></button>
    <button class="nav" data-action="nav" data-tab="vendors">${ICON.biz}<span>업체</span></button>
    <div class="spacer"></div>
    <div class="side-actions">
      <button class="nav" data-action="export">${ICON.dl}<span>백업 내보내기</span></button>
      <button class="nav" data-action="import">${ICON.ul}<span>백업 가져오기</span></button>
    </div>
    <div class="sync" id="sync" data-mode="local"><i></i><span>연결 확인 중</span></div>
  </aside>
  <main class="main" id="main"></main>
  <nav class="tabbar">
    <button class="tab" data-action="nav" data-tab="home">${ICON.home}캘린더</button>
    <button class="tab" data-action="nav" data-tab="projects">${ICON.task}프로젝트</button>
    <button class="tab" data-action="nav" data-tab="materials">${ICON.mat}자재</button>
    <button class="tab" data-action="nav" data-tab="vendors">${ICON.biz}업체</button>
  </nav>
</div>
<dialog id="dlg"><form id="dlgForm" novalidate></form></dialog>
<dialog id="cfm" class="cfm"><div class="cfm-b"><p id="cfmMsg"></p><div class="r"><button type="button" class="btn" data-cfm="0">취소</button><button type="button" class="btn danger" data-cfm="1" id="cfmOk">삭제</button></div></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
const COLS=['projects','materials','events','tasks','vendors'];
const VENDOR_TYPES=['고객사','구매처','외주/협력사'];
const LS_KEY='inspector-board-v1';
const CATEGORIES=['PC','카메라','렌즈','조명','프레임/기구','소프트웨어/라이선스','외주/서비스','기타'];
const STAGES=['요청 전','견적 요청','견적 접수','발주 완료','입고 완료'];
const STAGE_TONE={'요청 전':'gray','견적 요청':'warn','견적 접수':'info','발주 완료':'accent','입고 완료':'ok'};
const PROJECT_STATUS=['검토 중','진행 중','진행대기','출장대기','완료'];
const BOARD_STATUS=PROJECT_STATUS.filter(s=>s!=='완료'); // 메인 보드에는 완료를 보여주지 않는다
const PROJECT_TONE={'검토 중':'info','진행 중':'warn','진행대기':'crit','출장대기':'trip','완료':'ok'};
const PROJECT_DESC={'검토 중':'검토·견적 단계','진행 중':'진행 중인 과제','진행대기':'착수 대기','출장대기':'출장 대기','완료':'완료된 과제'};
const EVENT_TYPES=['회의','납기','출장','검수','기타'];
const DOW=['일','월','화','수','목','금','토'];

const ICON={
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',
  proj:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 20V9"/></svg>',
  mat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  task:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 12l3 3 5-6"/></svg>',
  biz:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a1 1 0 011-1h8a1 1 0 011 1v16M14 10h5a1 1 0 011 1v10M3 21h18M8 8h2M8 12h2M8 16h2"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10-4-4L4 16v4zM13 7l4 4"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"/></svg>',
  ul:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5M4 20h16"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
  target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>',
  plane:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  meet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4V5z"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h13l-3 4 3 4H5"/></svg>',
  inspect:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>',
  cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.5 11h11L21 7H6.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h6M9 16h6"/></svg>',
};
const EVENT_ICON={'회의':'meet','납기':'flag','출장':'plane','검수':'inspect','기타':'note'};
document.querySelectorAll('[data-action]').forEach(b=>{ b.innerHTML=b.innerHTML.replace(/\$\{ICON\.(\w+)\}/g,(_,k)=>ICON[k]||''); });

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const fmtISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const todayISO=()=>fmtISO(new Date());
const addDays=(iso,n)=>{const d=parseISO(iso);d.setDate(d.getDate()+n);return fmtISO(d);};
const diffDays=(a,b)=>Math.round((parseISO(a)-parseISO(b))/86400000);
const shortDate=iso=>iso?iso.slice(5).replace('-','/'):'';

const PREFS_KEY='inspector-board-prefs';
const ui={tab:'home',detail:'',matFilter:{project:'',stage:'',q:''},projView:{group:'status',status:'',client:''},showDone:false,keepShown:new Set(),cal:(()=>{const d=new Date();return {y:d.getFullYear(),m:d.getMonth()};})(),selDay:todayISO(),layers:{events:true,projects:true,eta:true,tasks:true,order:false}};

const store={
  mode:'local',db:null,downloads:null,loaded:{projects:false,materials:false,events:false,tasks:false,vendors:false},
  data:{projects:[],materials:[],events:[],tasks:[],vendors:[]},
  async init(){
    let db=null;
    try{ db=(window.claude&&typeof window.claude.use==='function')?await window.claude.use('db'):null; }catch(e){ db=null; }
    if(db){ this.db=db; this.mode='cloud'; this.subscribe(); this.offerMigration(); }
    else{ this.mode='local'; this.loadLocal(); COLS.forEach(c=>this.loaded[c]=true); }
    try{ this.downloads=(window.claude&&typeof window.claude.use==='function')?await window.claude.use('downloads'):null; }catch(e){ this.downloads=null; }
    renderSync(); render();
  },
  subscribe(){
    for(const col of COLS){
      this.db.collection(col).onSnapshot(snap=>{
        this.data[col]=snap.docs.filter(d=>d.exists).map(d=>Object.assign({id:d.id},d.data()));
        this.loaded[col]=true; render();
        if(COLS.every(c=>this.loaded[c])&&this._onLoaded){ const f=this._onLoaded; this._onLoaded=null; f(); }
      },err=>{ toast('동기화가 끊겼어요. 페이지를 새로고침해 주세요.'); });
    }
  },
  // 클라우드 모드로 열렸는데 서버가 비어 있고 이 브라우저에 예전 데이터가 남아 있으면 한 번에 옮겨 준다.
  async offerMigration(){
    let local=null; try{ local=JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){}
    const cnt=o=>o?COLS.reduce((n,c)=>n+(Array.isArray(o[c])?o[c].length:0),0):0;
    if(!cnt(local)) return;
    if(!COLS.every(c=>this.loaded[c])) await new Promise(res=>{ this._onLoaded=res; });
    if(cnt(this.data)) return;
    let asked=false; try{ asked=sessionStorage.getItem('migrate-asked')==='1'; }catch(e){}
    if(asked) return;
    try{ sessionStorage.setItem('migrate-asked','1'); }catch(e){}
    const parts=[['projects','프로젝트'],['tasks','할 일'],['materials','자재'],['events','일정'],['vendors','업체']].filter(([c])=>local[c]&&local[c].length).map(([c,l])=>`${l} ${local[c].length}건`).join(', ');
    if(!await askConfirm(`이 브라우저에 저장된 데이터(${parts})가 있어요.\n클라우드로 옮겨서 모든 기기에서 볼 수 있게 할까요?`,'클라우드로 옮기기',true)) return;
    try{ await this.replaceAll(local); toast('클라우드로 옮겼어요.'); }catch(e){ toast('옮기지 못했어요. 잠시 후 다시 시도해 주세요.'); }
  },
  loadLocal(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const p=JSON.parse(raw); for(const c of COLS) if(Array.isArray(p[c])) this.data[c]=p[c]; } }catch(e){} },
  saveLocal(){ try{ localStorage.setItem(LS_KEY,JSON.stringify(this.data)); }catch(e){ toast('이 브라우저에 저장하지 못했어요.'); } },
  async put(col,obj){
    if(this.mode==='cloud'){ const body=Object.assign({},obj); delete body.id; await this.db.doc(col+'/'+obj.id).set(body); }
    else{ const arr=this.data[col]; const i=arr.findIndex(x=>x.id===obj.id); if(i>=0) arr[i]=obj; else arr.push(obj); this.saveLocal(); render(); }
  },
  async remove(col,id){
    if(this.mode==='cloud'){ await this.db.doc(col+'/'+id).delete(); }
    else{ this.data[col]=this.data[col].filter(x=>x.id!==id); this.saveLocal(); render(); }
  },
  async replaceAll(next){
    if(this.mode==='cloud'){
      for(const col of COLS){
        for(const d of this.data[col]) await this.db.doc(col+'/'+d.id).delete();
        for(const d of next[col]||[]){ const body=Object.assign({},d); delete body.id; await this.db.doc(col+'/'+(d.id||uid())).set(body); }
      }
    }else{ for(const c of COLS) this.data[c]=(next[c]||[]).map(d=>Object.assign({},d,{id:d.id||uid()})); this.saveLocal(); render(); }
  }
};

const D=store.data;
function loadPrefs(){ try{ const p=JSON.parse(localStorage.getItem(PREFS_KEY)||'{}'); if(p.projView) Object.assign(ui.projView,p.projView); if(typeof p.showDone==='boolean') ui.showDone=p.showDone; }catch(e){} }
function savePrefs(){ try{ localStorage.setItem(PREFS_KEY,JSON.stringify({projView:ui.projView,showDone:ui.showDone})); }catch(e){} }
loadPrefs();
const projById=id=>D.projects.find(p=>p.id===id);
const projName=id=>{const p=projById(id);return p?p.name:(id?'(삭제된 프로젝트)':'미배정');};
const projStatus=p=>p.status==='대기'?'진행대기':(PROJECT_STATUS.includes(p.status)?p.status:'진행 중');
const longDate=iso=>iso?parseISO(iso).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'}):'';
const monthDay=iso=>iso?parseISO(iso).toLocaleDateString('ko-KR',{month:'long',day:'numeric'}):'';
// 프로젝트 기간. 예전 데이터의 목표일(dueDate)은 종료일로 취급한다.
const projDates=p=>{ const end=p.endDate||p.dueDate||p.startDate||'', start=p.startDate||end; return {start,end}; };
const projRangeText=p=>{ const {start,end}=projDates(p); if(!end) return ''; return start!==end?`${longDate(start)} ~ ${monthDay(end)}`:longDate(end); };
const isOpen=m=>m.stage!=='입고 완료';
const etaState=m=>{ if(!m.etaDate||!isOpen(m)) return ''; const dd=diffDays(m.etaDate,todayISO()); return dd<0?'crit':(dd<=7?'soon':''); };
const dueState=t=>{ if(!t.dueDate||t.done) return ''; const dd=diffDays(t.dueDate,todayISO()); return dd<0?'crit':(dd<=3?'soon':''); };
function projectProgress(p){
  const ms=D.materials.filter(m=>m.projectId===p.id), ts=D.tasks.filter(t=>t.projectId===p.id);
  const mDone=ms.filter(m=>!isOpen(m)).length, tDone=ts.filter(t=>t.done).length, total=ms.length+ts.length;
  return {ms,ts,mDone,tDone,total,done:mDone+tDone,pct:total?Math.round((mDone+tDone)/total*100):0};
}

function renderSync(){
  const el=document.getElementById('sync'); el.dataset.mode=store.mode;
  el.querySelector('span').textContent=store.mode==='cloud'?'클라우드 동기화 · 모든 기기에서 공유':'이 브라우저에만 저장';
}
const vendorNames=type=>{ const s=new Set(); for(const v of D.vendors) if(!type||v.type===type) s.add(v.name); return [...s]; };
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }

function render(){
  if(ui.tab==='project'&&!projById(ui.detail)) ui.tab='home';
  const navTab=ui.tab==='project'?'home':ui.tab;
  document.querySelectorAll('[data-action="nav"]').forEach(b=>{ if(b.dataset.tab===navTab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  const main=document.getElementById('main');
  const loading=!COLS.every(c=>store.loaded[c]);
  if(loading){ main.innerHTML='<div class="topbar"><div><h1>불러오는 중</h1><div class="sub">저장된 데이터를 가져오고 있어요.</div></div></div>'; return; }
  main.innerHTML={home:renderHome,project:renderProjectDetail,projects:renderProjects,materials:renderMaterials,vendors:renderVendors}[ui.tab]();
}

function progressHTML(pr){
  const parts=[]; if(pr.ms.length) parts.push(`자재 ${pr.mDone}/${pr.ms.length}`); if(pr.ts.length) parts.push(`할 일 ${pr.tDone}/${pr.ts.length}`);
  return `<span class="prog"><span class="prog-l"><span>${parts.join(' · ')||'항목 없음'}</span><b>${pr.total?pr.pct+'%':'–'}</b></span><span class="bar"><i style="width:${pr.pct}%"></i></span></span>`;
}
function renderHome(){

function renderProjects(){
  const today=todayISO(), pv=ui.projView;
  const sortTasks=ts=>ts.slice().sort((a,b)=>(a.done-b.done)||((a.dueDate||'9')<(b.dueDate||'9')?-1:1));
  const visible=t=>ui.showDone||!t.done||ui.keepShown.has(t.id);
  const endOf=p=>projDates(p).end||'9';
  const byDue=(a,b)=>(endOf(a)<endOf(b)?-1:endOf(a)>endOf(b)?1:0)||a.name.localeCompare(b.name);
  const byStatus=(a,b)=>(PROJECT_STATUS.indexOf(projStatus(a))-PROJECT_STATUS.indexOf(projStatus(b)))||byDue(a,b);
  const sectionHTML=p=>{
    const pr=projectProgress(p), st=projStatus(p);
    const next=pr.ms.filter(m=>isOpen(m)&&m.etaDate).sort((a,b)=>a.etaDate<b.etaDate?-1:1)[0];
    const shown=sortTasks(pr.ts.filter(visible)), hidden=pr.ts.length-shown.length;
    return `<section class="panel proj-sec ${st==='완료'?'is-done':''}">
      <div class="proj-head">
        <div class="proj-title"><h2>${esc(p.name)}</h2><span class="m">${[p.client,projRangeText(p),p.notes].filter(Boolean).map(esc).join(' · ')}</span></div>
        <span class="pill tone-${PROJECT_TONE[st]}">${esc(st)}${st==='진행 중'&&pr.total?' · '+pr.pct+'%':''}</span>
        <div class="proj-tools"><button class="btn sm ghost" data-action="goto-project" data-project="${p.id}">상세${ICON.chev}</button><button class="btn sm ghost" data-action="edit-project" data-id="${p.id}" aria-label="프로젝트 수정">${ICON.edit}</button><button class="btn sm" data-action="add-task" data-project="${p.id}">${ICON.plus}할 일</button></div>
      </div>
      <div class="proj-meta">${progressHTML(pr)}
        <button class="btn sm ghost mat-link" data-action="goto-mat" data-project="${p.id}">자재 ${pr.mDone}/${pr.ms.length} 입고${next?' · 다음 '+shortDate(next.etaDate):''}${ICON.chev}</button></div>
      <div class="list">${shown.map(taskRowHTML).join('')||`<div class="empty small">${pr.ts.length?'남은 할 일이 없어요':'할 일을 추가해 진행률에 반영해 보세요'}</div>`}</div>
      ${hidden?`<button class="hidden-note" data-action="show-done">완료된 할 일 ${hidden}건 보기</button>`:''}
    </section>`;};
  const groupHead=(label,n)=>`<div class="proj-group">${label}<span class="cnt">${n}건</span></div>`;

  if(pv.status) list=list.filter(p=>projStatus(p)===pv.status);
  if(pv.client) list=list.filter(p=>(p.client||'')===(pv.client==='__none'?'':pv.client));
  let body='';
  if(pv.group==='client'){
    const clients=[...new Set(list.map(p=>p.client||''))].sort((a,b)=>a===''?1:b===''?-1:a.localeCompare(b));
    body=clients.map(c=>{ const ps=list.filter(p=>(p.client||'')===c).sort(byStatus); return groupHead(c?esc(c):'고객사 미지정',ps.length)+ps.map(sectionHTML).join(''); }).join('');
  }else if(pv.group==='due'){
    body=list.sort(byDue).map(sectionHTML).join('');
  }else{
    body=PROJECT_STATUS.map(st=>{ const ps=list.filter(p=>projStatus(p)===st).sort(byDue); if(!ps.length) return ''; return groupHead(`<span class="pill tone-${PROJECT_TONE[st]}">${esc(st)}</span>`,ps.length)+ps.map(sectionHTML).join(''); }).join('');
  }
  const filtered=!!(pv.status||pv.client);
  const orphans=filtered?[]:sortTasks(D.tasks.filter(t=>!t.projectId||!projById(t.projectId)).filter(visible));
  const orphanSec=orphans.length?`<section class="panel proj-sec"><div class="proj-head"><div class="proj-title"><h2>프로젝트 미배정</h2></div></div><div class="list">${orphans.map(taskRowHTML).join('')}</div></section>`:'';
  const open=D.tasks.filter(t=>!t.done).length, late=D.tasks.filter(t=>!t.done&&t.dueDate&&t.dueDate<today).length, doneCnt=D.tasks.length-open;
  const clientOpts=[...new Set(D.projects.map(p=>p.client||''))].sort((a,b)=>a===''?1:b===''?-1:a.localeCompare(b)).map(c=>`<option value="${c?esc(c):'__none'}" ${pv.client===(c||'__none')?'selected':''}>${c?esc(c):'고객사 미지정'}</option>`).join('');
  const empty=D.projects.length?`<div class="panel"><div class="empty"><b>조건에 맞는 프로젝트가 없어요</b>필터를 바꿔 보세요.</div></div>`:`<div class="panel"><div class="empty"><b>등록된 프로젝트가 없어요</b>오른쪽 위 버튼으로 과제를 추가하세요.</div></div>`;

    <div class="actions"><label class="switch"><input type="checkbox" id="showDone" data-action="toggle-show-done" ${ui.showDone?'checked':''}>완료한 할 일 표시</label><button class="btn" data-action="add-task">${ICON.plus}할 일</button><button class="btn primary" data-action="add-project">${ICON.plus}프로젝트</button></div></div>
    <div class="filters">
      <select data-pfilter="group" aria-label="보기 방식"><option value="status" ${pv.group==='status'?'selected':''}>진행상황별 보기</option><option value="client" ${pv.group==='client'?'selected':''}>고객사별 보기</option><option value="due" ${pv.group==='due'?'selected':''}>목표일순 보기</option></select>
      <select data-pfilter="status" aria-label="상태 필터"><option value="">모든 상태</option>${PROJECT_STATUS.map(st=>`<option value="${st}" ${pv.status===st?'selected':''}>${st}</option>`).join('')}</select>
      <select data-pfilter="client" aria-label="고객사 필터"><option value="">모든 고객사</option>${clientOpts}</select>
    </div>
    <div class="proj-list">${body||empty}${orphanSec}</div>`;
}

function calendarItems(y,m){
  const map=new Map(), add=(iso,it)=>{ if(!map.has(iso)) map.set(iso,[]); map.get(iso).push(it); };

function calendarHTML(){
  const {y,m}=ui.cal, today=todayISO();
  const first=new Date(y,m,1), startDow=first.getDay(), days=new Date(y,m+1,0).getDate();
  const items=calendarItems(y,m);
  const cells=[]; for(let i=0;i<startDow;i++) cells.push(null); for(let d=1;d<=days;d++) cells.push(fmtISO(new Date(y,m,d))); while(cells.length%7) cells.push(null);
  // 셀 안쪽 여백 6px + 날짜 줄 22px + 간격 3px 아래부터 23px 간격으로 줄(레인)을 놓는다. 단일 항목 칩은 그 아래에 이어진다.
  const LANE_TOP=31, LANE_H=23;
  const weeks=[]; for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  const grid=weeks.map(week=>{
    // 이 주에 걸쳐 있는 여러 날짜 항목을 모아 시작 열·끝 열을 구한다
    const seen=new Map();
    week.forEach((iso,col)=>{ if(!iso) return; for(const it of items.get(iso)||[]){ if(!it.span) continue; const sp=seen.get(it.key); if(sp) sp.c1=col; else seen.set(it.key,{it,c0:col,c1:col}); } });
    const spans=[...seen.values()].sort((a,b)=>(a.c0-b.c0)||((b.c1-b.c0)-(a.c1-a.c0))||a.it.label.localeCompare(b.it.label));
    const lanes=[];
    for(const sp of spans){ let l=0; while(lanes[l]&&lanes[l].some(([a,b])=>!(sp.c1<a||sp.c0>b))) l++; (lanes[l]=lanes[l]||[]).push([sp.c0,sp.c1]); sp.lane=l; }
    const lanesAt=col=>spans.reduce((m,sp)=>(sp.c0<=col&&col<=sp.c1)?Math.max(m,sp.lane+1):m,0);
    const cellsHTML=week.map((iso,col)=>{
      if(!iso) return '<div class="cell pad"></div>';
      const its=items.get(iso)||[], dn=Number(iso.slice(8)), singles=its.filter(it=>!it.span), n=lanesAt(col);
      const chips=singles.slice(0,3).map(it=>`<span class="chip tone-${it.tone}${it.kind==='project'?' proj':''}" title="${esc(it.sub)}" draggable="true" data-drag="${it.kind}" data-id="${it.id}">${ICON[it.icon]||''}<span>${esc(it.label)}</span></span>`).join('')+(singles.length>3?`<span class="chip more">+${singles.length-3}</span>`:'');
      const dots=its.slice(0,4).map(it=>`<i class="dot-${it.tone}"></i>`).join('');
      return `<button class="cell ${iso===today?'today':''} ${iso===ui.selDay?'sel':''} ${col===0?'sun':(col===6?'sat':'')}" data-action="cal-day" data-day="${iso}">
        <span class="dn"><b>${dn}</b>${its.length?`<span>${its.length}</span>`:''}</span>${n?`<span class="spacer" style="height:${n*LANE_H-3}px"></span>`:''}${chips}<span class="dots">${dots}</span></button>`;
    }).join('');
    const barsHTML=spans.map(sp=>{
      const it=sp.it, cl=it.start<week[sp.c0], cr=it.end>week[sp.c1];
      const left=`calc(${sp.c0}/7*100%${cl?'':' + 2px'})`, width=`calc(${sp.c1-sp.c0+1}/7*100% - ${(cl?0:2)+(cr?0:2)}px)`;
      return `<button class="chip bar-item tone-${it.tone}${it.kind==='project'?' proj':''}${cl?' cl':''}${cr?' cr':''}" style="left:${left};width:${width};top:${LANE_TOP+sp.lane*LANE_H}px" title="${esc(it.sub)}" draggable="true" data-drag="${it.kind}" data-action="${it.action}" data-id="${it.id}">${ICON[it.icon]||''}<span>${esc(it.label)}</span></button>`;
    }).join('');
    return `<div class="week">${cellsHTML}<div class="bars">${barsHTML}</div></div>`;
  }).join('');
  const sel=ui.selDay, selItems=items.get(sel)||[], sd=parseISO(sel);
  const dayList=selItems.length?selItems.map(it=>`<button class="day-item" data-action="${it.action}" data-id="${it.id}" style="--c:var(--${it.tone})"><i></i><span><span class="t">${ICON[it.icon]||''}${esc(it.label)}</span><br><span class="m">${esc(it.sub)}</span></span></button>`).join('')
    :`<div class="empty"><b>${sel===today?'오늘은':'이 날은'} 비어 있어요</b>위의 + 할 일, + 일정 버튼으로 이 날짜에 추가할 수 있어요.</div>`;
  const dayTitle=sel===today?'오늘 할 일':`${sd.getMonth()+1}/${sd.getDate()} (${DOW[sd.getDay()]}) 할 일`;
  const layer=(k,l)=>`<button class="layer" data-action="layer" data-layer="${k}" aria-pressed="${ui.layers[k]}"><i></i>${l}</button>`;
  return `<div class="cal-toolbar">
      <div class="mo"><button class="btn sm" data-action="cal-prev" aria-label="이전 달">‹</button><h2>${y}.${pad(m+1)}</h2><button class="btn sm" data-action="cal-next" aria-label="다음 달">›</button><button class="btn sm ghost" data-action="cal-today">오늘</button></div>
      <div class="layers">${layer('events','일정')}${layer('projects','프로젝트')}${layer('eta','입고예정')}${layer('tasks','할 일')}${layer('order','발주일')}</div>
    </div>
    <div class="cal-wrap">
      <div class="cal"><div class="dow">${DOW.map(d=>`<span>${d}</span>`).join('')}</div><div class="grid">${grid}</div></div>
      <div class="day-col"><div class="panel day-panel"><div class="panel-h"><h2>${dayTitle}</h2><span class="r"><button class="btn sm ghost" data-action="add-task" data-day="${sel}">${ICON.plus}할 일</button><button class="btn sm ghost" data-action="add-event" data-day="${sel}">${ICON.plus}일정</button></span></div><div class="list">${dayList}</div></div></div>
    </div>`;
}

function fieldHTML(f){
  const id='f_'+f.key, v=f.value??'';

  if(f.type==='select') ctl=`<select id="${id}" name="${f.key}"${f.newField?` data-new-field="${f.newField}"`:''}>${f.allowEmpty?'<option value="">선택 안 함</option>':''}${f.options.map(o=>{const [val,label]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(label)}</option>`;}).join('')}</select>`;
  else if(f.type==='textarea') ctl=`<textarea id="${id}" name="${f.key}" rows="3">${esc(v)}</textarea>`;
  else{
    const list=f.suggest&&f.suggest.length?` list="dl_${f.key}"`:'';
    ctl=`<input id="${id}" name="${f.key}" type="${f.type||'text'}" value="${esc(v)}"${list} ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:''} ${f.type==='number'?'min="0" step="1" inputmode="numeric"':''} ${f.required?'required':''} autocomplete="off">`;

      ...projectFields(t.projectId),
      {key:'dueDate',label:'마감일',type:'date',value:t.dueDate},
      {key:'done',label:'상태',type:'select',options:[['0','미완료'],['1','완료']],value:t.done?'1':'0'},
      {key:'notes',label:'메모',type:'textarea',value:t.notes,span:true}],
    onSubmit:async v=>{ await resolveProject(v); v.done=v.done==='1'; await store.put('tasks',Object.assign({},t,v,{id:t.id||uid(),createdAt:t.createdAt||new Date().toISOString(),doneAt:v.done?(t.doneAt||new Date().toISOString()):null})); toast(isNew?'할 일을 추가했어요.':'저장했어요.'); },
    onDelete:isNew?null:async()=>{ if(!await askConfirm(`"${t.title}" 할 일을 삭제할까요?`)) return; await store.remove('tasks',t.id); dlg.close(); toast('삭제했어요.'); }
  });
}
async function toggleMaterial(id){
  const m=D.materials.find(x=>x.id===id); if(!m) return;
  const receive=isOpen(m);
  const next=receive
    ?Object.assign({},m,{prevStage:m.stage||'요청 전',stage:'입고 완료',receivedDate:m.receivedDate||todayISO()})
    :Object.assign({},m,{stage:(m.prevStage&&m.prevStage!=='입고 완료')?m.prevStage:'발주 완료',receivedDate:''});
  try{ await store.put('materials',next); toast(receive?`"${m.name}" 입고 완료로 표시했어요.`:`"${m.name}" 미입고로 되돌렸어요.`); }
  catch(err){ toast('저장하지 못했어요. 잠시 후 다시 시도해 주세요.'); render(); }
}
async function toggleTask(id){
  const t=D.tasks.find(x=>x.id===id); if(!t) return;
  const done=!t.done;
  if(done) ui.keepShown.add(id); else ui.keepShown.delete(id); // 방금 완료한 항목은 화면을 떠나기 전까지 보이게 둔다
  try{ await store.put('tasks',Object.assign({},t,{done,doneAt:done?new Date().toISOString():null})); }catch(err){ toast('저장하지 못했어요. 잠시 후 다시 시도해 주세요.'); render(); }
}
function importForm(){
  openForm({title:'백업 가져오기',help:'내보내기로 받은 JSON 내용을 붙여 넣으세요. 현재 데이터는 모두 교체됩니다.',
    fields:[{key:'json',label:'JSON',type:'textarea',value:'',span:true,required:true}],submitLabel:'교체하기',
    onSubmit:async v=>{ let p; try{ p=JSON.parse(v.json); }catch(err){ throw new Error('bad'); } if(!p||typeof p!=='object'||!COLS.some(c=>Array.isArray(p[c]))){ toast('형식이 맞지 않아요. 내보내기 파일 그대로 붙여 넣어 주세요.'); throw new Error('bad'); }
      if(!await askConfirm('현재 데이터를 모두 지우고 붙여 넣은 내용으로 교체할까요?','교체하기')) throw silent('cancel');
      await store.replaceAll(p); toast('가져왔어요.'); }
  });
}
async function exportData(){
  const json=JSON.stringify({exportedAt:new Date().toISOString(),projects:D.projects,materials:D.materials,events:D.events,tasks:D.tasks,vendors:D.vendors},null,2);
  const name='inspector-board-'+todayISO()+'.json';
  if(store.downloads){ try{ await store.downloads.save({filename:name,data:json}); toast('백업 파일을 저장했어요.'); return; }catch(err){ if(err&&err.code==='declined') return; } }
  try{ await navigator.clipboard.writeText(json); toast('백업 JSON을 클립보드에 복사했어요.'); }
  catch(err){ openForm({title:'백업 내보내기',help:'아래 내용을 복사해 파일로 보관하세요.',fields:[{key:'json',label:'JSON',type:'textarea',value:json,span:true}],submitLabel:'닫기',onSubmit:async()=>{}}); }
}

// ---- 달력 드래그로 날짜 옮기기 ----
let drag=null;
const dayAtPoint=(x,y)=>{ const cell=document.elementsFromPoint(x,y).find(n=>n.classList&&n.classList.contains('cell')&&n.dataset.day); return cell?cell.dataset.day:''; };
document.addEventListener('dragstart',e=>{
  const el=e.target.closest&&e.target.closest('[data-drag]'); if(!el){ return; }
  const from=(el.closest('.cell')&&el.closest('.cell').dataset.day)||dayAtPoint(e.clientX,e.clientY);
  if(!from){ e.preventDefault(); return; }
  drag={kind:el.dataset.drag,id:el.dataset.id,from};
  try{ e.dataTransfer.setData('text/plain',drag.id); e.dataTransfer.effectAllowed='move'; }catch(_){}
  el.classList.add('ghost'); document.body.classList.add('dragging');
});
document.addEventListener('dragover',e=>{
  if(!drag) return; const cell=e.target.closest&&e.target.closest('.cell:not(.pad)'); if(!cell) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move';
  if(!cell.classList.contains('drop')){ document.querySelectorAll('.cell.drop').forEach(c=>c.classList.remove('drop')); cell.classList.add('drop'); }
});
document.addEventListener('dragleave',e=>{ const cell=e.target.closest&&e.target.closest('.cell'); if(cell&&!cell.contains(e.relatedTarget)) cell.classList.remove('drop'); });
document.addEventListener('drop',e=>{
  if(!drag) return; const cell=e.target.closest&&e.target.closest('.cell:not(.pad)'); if(!cell) return;
  e.preventDefault(); const d=drag; drag=null; cleanupDrag();
  const delta=diffDays(cell.dataset.day,d.from); if(delta) moveItem(d.kind,d.id,delta);
});
document.addEventListener('dragend',()=>{ drag=null; cleanupDrag(); });
function cleanupDrag(){ document.body.classList.remove('dragging'); document.querySelectorAll('.cell.drop').forEach(c=>c.classList.remove('drop')); document.querySelectorAll('.chip.ghost').forEach(c=>c.classList.remove('ghost')); }
async function moveItem(kind,id,delta){
  const shift=d=>d?addDays(d,delta):'';
  let col,obj,label,to;
  if(kind==='event'){ col='events'; const e=D.events.find(x=>x.id===id); if(!e) return; obj=Object.assign({},e,{start:shift(e.start),end:shift(e.end)}); label=e.title; to=obj.start; }
  else if(kind==='project'){ col='projects'; const p=projById(id); if(!p) return; const {start,end}=projDates(p); obj=Object.assign({},p,{startDate:shift(start),endDate:shift(end),dueDate:''}); label=p.name; to=obj.startDate; }
  else if(kind==='task'){ col='tasks'; const t=D.tasks.find(x=>x.id===id); if(!t) return; obj=Object.assign({},t,{dueDate:shift(t.dueDate)}); label=t.title; to=obj.dueDate; }
  else if(kind==='eta'){ col='materials'; const m=D.materials.find(x=>x.id===id); if(!m) return; obj=Object.assign({},m,{etaDate:shift(m.etaDate)}); label=m.name; to=obj.etaDate; }
  else if(kind==='order'){ col='materials'; const m=D.materials.find(x=>x.id===id); if(!m) return; obj=Object.assign({},m,{orderDate:shift(m.orderDate)}); label=m.name; to=obj.orderDate; }
  else return;
  try{ await store.put(col,obj); toast(`"${label}" → ${shortDate(to)}${kind==='event'||kind==='project'?' (기간 유지)':''}`); }
  catch(err){ toast('옮기지 못했어요. 잠시 후 다시 시도해 주세요.'); render(); }
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ') return;
  const el=e.target.closest&&e.target.closest('[role="button"][data-action]'); if(!el||e.target!==el) return;
  e.preventDefault(); el.click();
});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]'); if(!el) return;
  const a=el.dataset.action, id=el.dataset.id;
  switch(a){
    case 'nav': ui.tab=el.dataset.tab; ui.keepShown.clear(); render(); window.scrollTo(0,0); break;
    case 'goto-mat': ui.matFilter={project:el.dataset.project||'',stage:el.dataset.stage||'',q:''}; ui.tab='materials'; render(); window.scrollTo(0,0); break;
    case 'goto-project': ui.detail=el.dataset.project; ui.tab='project'; render(); window.scrollTo(0,0); break;
    case 'add-task': taskForm(null,{projectId:el.dataset.project||'',dueDate:el.dataset.day||''}); break;
    case 'toggle-show-done': ui.showDone=el.checked; savePrefs(); render(); break;
    case 'show-done': ui.showDone=true; savePrefs(); render(); break;
    case 'add-vendor': vendorForm(null); break;
    case 'edit-vendor': { const v=D.vendors.find(x=>x.id===id); if(v) vendorForm(v); break; }
    case 'noop': e.stopPropagation(); break;
    case 'edit-task': { if(e.target.closest('.chk')) break; const t=D.tasks.find(x=>x.id===id); if(t) taskForm(t); break; }
    case 'toggle-task': toggleTask(id); break;
    case 'add-project': projectForm(null,{status:el.dataset.status||'진행 중'}); break;
    case 'edit-project': projectForm(projById(id)); break;
    case 'add-material': materialForm(null,{projectId:el.dataset.project||''}); break;
    case 'edit-material': { if(e.target.closest('.chk')) break; const m=D.materials.find(x=>x.id===id); if(m) materialForm(m); break; }
    case 'toggle-material': toggleMaterial(id); break;
    case 'add-event': eventForm(null,{start:el.dataset.day||ui.selDay,projectId:el.dataset.project||''}); break;
    case 'edit-event': { const ev=D.events.find(x=>x.id===id); if(ev) eventForm(ev); break; }
    case 'cal-prev': ui.cal.m--; if(ui.cal.m<0){ui.cal.m=11;ui.cal.y--;} render(); break;
    case 'cal-next': ui.cal.m++; if(ui.cal.m>11){ui.cal.m=0;ui.cal.y++;} render(); break;
    case 'cal-today': { const d=new Date(); ui.cal={y:d.getFullYear(),m:d.getMonth()}; ui.selDay=todayISO(); render(); break; }
    case 'cal-day': ui.selDay=el.dataset.day; render(); break;
    case 'layer': ui.layers[el.dataset.layer]=!ui.layers[el.dataset.layer]; render(); break;
    case 'export': exportData(); break;
    case 'import': importForm(); break;
    case 'dlg-close': dlg.close(); break;
    case 'dlg-delete': if(dlgCtx&&dlgCtx.onDelete) dlgCtx.onDelete().catch(()=>toast('삭제하지 못했어요.')); break;
  }
});
function onFilter(e){
  const pf=e.target.dataset&&e.target.dataset.pfilter;
  if(pf){ if(e.type!=='change') return; ui.projView[pf]=e.target.value; savePrefs(); render(); return; }
  const f=e.target.dataset&&e.target.dataset.filter; if(!f) return;
  const isSelect=e.target.tagName==='SELECT';
  if((isSelect&&e.type!=='change')||(!isSelect&&e.type!=='input')) return;
  ui.matFilter[f]=e.target.value;
  if(f==='q'){ clearTimeout(ui._qh); ui._qh=setTimeout(()=>{ const pos=e.target.selectionStart; render(); const inp=document.getElementById('fQ'); if(inp){ inp.focus(); try{ inp.setSelectionRange(pos,pos); }catch(_){} } },160); }
  else render();
}
document.addEventListener('input',onFilter);
document.addEventListener('change',onFilter);

render();
store.init();
})();
</script>
